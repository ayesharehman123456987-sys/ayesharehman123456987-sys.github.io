<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elite Freelance Hub — Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0b0b0f;
    color:white;
}

.box{
    width:420px;
    padding:40px;
    background:#15151c;
    border:1px solid #292933;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

.logo span{
    color:#b9ff39;
}

.subtitle{
    text-align:center;
    color:#999;
    margin-bottom:30px;
}

h2{
    margin-bottom:20px;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#ccc;
}

input,select{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #333;
    background:#0e0e13;
    color:white;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:0;
    border-radius:10px;
    background:#b9ff39;
    color:#101010;
    font-weight:bold;
    cursor:pointer;
}

.switch{
    text-align:center;
    margin-top:20px;
    color:#999;
}

.switch span{
    color:#b9ff39;
    cursor:pointer;
}

#message{
    margin-top:15px;
    text-align:center;
}

</style>
</head>

<body>

<div class="box">

<div class="logo">
✦ <span>ELITE</span> FREELANCE HUB
</div>

<p class="subtitle">
Real Freelance Marketplace
</p>

<div id="loginForm">

<h2>Welcome Back</h2>

<label>Email</label>
<input type="email" id="loginEmail" placeholder="Enter your email">

<label>Password</label>
<input type="password" id="loginPassword" placeholder="Enter your password">

<button id="loginBtn">
Login
</button>

<p class="switch">
Don't have an account?
<span id="showSignup">
Create Account
</span>
</p>

</div>


<div id="signupForm" style="display:none;">

<h2>Create Account</h2>

<label>Your Name</label>
<input type="text" id="signupName" placeholder="Enter your name">

<label>Email</label>
<input type="email" id="signupEmail" placeholder="Enter your email">

<label>Password</label>
<input type="password" id="signupPassword" placeholder="Create a password">

<label>Account Type</label>

<select id="signupRole">

<option value="freelancer">
Freelancer
</option>

<option value="client">
Client
</option>

</select>

<button id="signupBtn">
Create Account
</button>

<p class="switch">
Already have an account?
<span id="showLogin">
Login
</span>
</p>

</div>

<div id="message"></div>

</div><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyAOCEJrsfxYnY_d6966vNyzdh61mo245sE",

authDomain:
"elite-freelance-hub.firebaseapp.com",

projectId:
"elite-freelance-hub",

storageBucket:
"elite-freelance-hub.firebasestorage.app",

messagingSenderId:
"777611553956",

appId:
"1:777611553956:web:730b7df36570ff803a8a31"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);


const loginForm =
document.getElementById("loginForm");

const signupForm =
document.getElementById("signupForm");

const message =
document.getElementById("message");


document.getElementById("showSignup").onclick = () => {

loginForm.style.display="none";

signupForm.style.display="block";

message.innerText="";

};


document.getElementById("showLogin").onclick = () => {

signupForm.style.display="none";

loginForm.style.display="block";

message.innerText="";

};



document.getElementById("signupBtn").onclick =
async()=>{


const name =
document.getElementById("signupName").value.trim();


const email =
document.getElementById("signupEmail").value.trim();


const password =
document.getElementById("signupPassword").value;


const role =
document.getElementById("signupRole").value;



if(!name || !email || !password){

message.innerText="Please fill all fields.";

return;

}


try{


const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);


const user =
userCredential.user;



await setDoc(
doc(db,"users",user.uid),
{

name:name,

email:email,

role:role,

skills:""

}

);



message.innerText=
"Account created successfully!";



setTimeout(()=>{


if(role==="client"){

window.location.href=
"client-dashboard.html";

}else{

window.location.href=
"index.html";

}


},700);



}catch(error){

console.error(error);

message.innerText=
error.message;

}


};



document.getElementById("loginBtn").onclick =
async()=>{


const email =
document.getElementById("loginEmail").value.trim();


const password =
document.getElementById("loginPassword").value;



if(!email || !password){

message.innerText=
"Enter email and password.";

return;

}


try{


const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);


const user =
userCredential.user;


const userDoc =
await getDoc(
doc(db,"users",user.uid)
);


if(!userDoc.exists()){

message.innerText=
"Account profile not found.";

return;

}


const userData =
userDoc.data();


const role =
userData.role;


message.innerText=
"Login successful!";



setTimeout(()=>{


if(role==="client"){

window.location.href=
"client-dashboard.html";

}else{

window.location.href=
"index.html";

}


},500);



}catch(error){

console.error(error);

message.innerText=
error.message;

}


};

</script>login.html
