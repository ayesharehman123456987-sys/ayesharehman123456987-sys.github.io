<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ELITE FREELANCE HUB — Login</title>

<link rel="icon" href="profile.png">
<link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

<main class="auth-main">

<div class="auth-card">

<button class="brand auth-brand" id="authBrand" type="button">

<span class="mark">✦</span>

<span>
<strong>ELITE</strong>
<small>FREELANCE HUB</small>
</span>

</button>


<div class="page-head auth-head">

<label>REAL MARKETPLACE</label>

<h2 id="authTitle">
Welcome Back
</h2>

<p id="authSubtitle">
Sign in to your real account.
</p>

</div>


<div id="loginBox">

<label class="field">
Email
<input id="loginEmail" type="email" autocomplete="email" required>
</label>

<label class="field">
Password
<input id="loginPassword" type="password" autocomplete="current-password" required>
</label>

<button class="primary auth-button" id="loginBtn">
Login
</button>

<button class="secondary auth-button" id="showSignup">
Create Account
</button>

<button class="text-button" id="forgotPassword">
Forgot Password?
</button>

</div>


<div id="signupBox" style="display:none">

<label class="field">
Full Name
<input id="signupName" required>
</label>

<label class="field">
Email
<input id="signupEmail" type="email" required>
</label>

<label class="field">
Password
<input id="signupPassword" type="password" minlength="6" required>
</label>

<label class="field">
Account Type

<select id="signupRole">

<option value="freelancer">
Freelancer
</option>

<option value="client">
Client
</option>

</select>

</label>


<label class="field">
Avatar / Gender

<select id="signupGender">

<option value="female">
Female
</option>

<option value="male">
Male
</option>

</select>

</label>


<button class="primary auth-button" id="signupBtn">
Create Account
</button>

<button class="secondary auth-button" id="showLogin">
Back to Login
</button>

</div>


<div id="authMessage"></div>

<div class="auth-note">
Your account data is stored through Firebase Authentication and Cloud Firestore.
</div>

</div>

</main>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyAOCEJrsfxYnY_d6966vNyzdh61mo245sE",

authDomain:"elite-freelance-hub.firebaseapp.com",

projectId:"elite-freelance-hub",

storageBucket:"elite-freelance-hub.firebasestorage.app",

messagingSenderId:"777611553956",

appId:"1:777611553956:web:730b7df36570ff803a8a31"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const $=id=>document.getElementById(id);


function message(text,type="info"){

const box=$("authMessage");

box.textContent=text;

box.className=type;

}


$("showSignup").onclick=()=>{

$("loginBox").style.display="none";

$("signupBox").style.display="block";

$("authTitle").textContent="Create Account";

$("authSubtitle").textContent="Join ELITE FREELANCE HUB.";

message("");

};


$("showLogin").onclick=()=>{

$("signupBox").style.display="none";

$("loginBox").style.display="block";

$("authTitle").textContent="Welcome Back";

$("authSubtitle").textContent="Sign in to your real account.";

message("");

};


$("signupBtn").onclick=async()=>{

try{

const name=$("signupName").value.trim();

const email=$("signupEmail").value.trim().toLowerCase();

const password=$("signupPassword").value;

const role=$("signupRole").value;

const gender=$("signupGender").value;


if(!name || !email){

message("Please fill all required fields.","error");

return;

}


if(password.length<6){

message("Password must be at least 6 characters.","error");

return;

}


const credential=
await createUserWithEmailAndPassword(
auth,
email,
password
);


await setDoc(
doc(db,"users",credential.user.uid),
{

name,

email,

role,

gender,

skills:"",

bio:"",

location:"",

hourlyRate:0,

availability:"Available",

rating:0,

ratingCount:0,

createdAt:serverTimestamp()

}
);


message("Account created successfully. Opening your dashboard...","success");


setTimeout(()=>{

location.href=
role==="client"
?"client-dashboard.html"
:"index.html";

},500);


}catch(error){

console.error(error);

message(
error.message.replace("Firebase: ",""),
"error"
);

}

};


$("loginBtn").onclick=async()=>{

try{

const email=$("loginEmail").value.trim().toLowerCase();

const password=$("loginPassword").value;


if(!email || !password){

message("Enter your email and password.","error");

return;

}


const credential=
await signInWithEmailAndPassword(
auth,
email,
password
);


const snap=
await getDoc(
doc(db,"users",credential.user.uid)
);


if(!snap.exists()){

message("Your account profile is missing. Please contact support.","error");

return;

}


const data=snap.data();

const owner=
email==="ayesharehman123456987@gmail.com";


location.href=
owner
?"index.html"
:data.role==="client"
?"client-dashboard.html"
:"index.html";


}catch(error){

console.error(error);

message(
error.message.replace("Firebase: ",""),
"error"
);

}

};


$("forgotPassword").onclick=async()=>{

const email=$("loginEmail").value.trim().toLowerCase();

if(!email){

message("Enter your email first.","error");

return;

}


try{

await sendPasswordResetEmail(auth,email);

message(
"Password reset email sent. Check your inbox.",
"success"
);

}catch(error){

message(
error.message.replace("Firebase: ",""),
"error"
);

}

};


$("authBrand").onclick=()=>{

location.reload();

};

</script>

</body>
</html>
