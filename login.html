<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>
ELITE FREELANCE HUB — Login
</title>

<link
    rel="icon"
    href="profile.png"
>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>

<main
    class="main login-main"
>

<div
    class="form-box login-box"
>

<div
    class="brand login-brand"
>

<span class="mark">
    ✦
</span>

<div>

<strong>
    ELITE
</strong>

<small>
    FREELANCE HUB
</small>

</div>

</div>


<div
    class="page-head login-head"
>

<label>
    REAL MARKETPLACE
</label>

<h2 id="authTitle">
    Welcome Back
</h2>

<p>
    Sign in to your real account.
</p>

</div>


<!-- LOGIN -->

<div id="loginBox">

<label class="field">

Email

<input
    id="loginEmail"
    type="email"
    autocomplete="email"
    required
>

</label>


<label class="field">

Password

<input
    id="loginPassword"
    type="password"
    autocomplete="current-password"
    required
>

</label>


<button
    class="primary login-action"
    id="loginBtn"
>

Login

</button>


<button
    class="secondary login-action"
    id="showSignup"
>

Create Account

</button>

</div>


<!-- SIGNUP -->

<div
    id="signupBox"
    style="display:none"
>

<label class="field">

Name

<input
    id="signupName"
    autocomplete="name"
>

</label>


<label class="field">

Email

<input
    id="signupEmail"
    type="email"
    autocomplete="email"
>

</label>


<label class="field">

Password

<input
    id="signupPassword"
    type="password"
    autocomplete="new-password"
>

</label>


<label class="field">

Gender

<select id="signupGender">

<option value="">
Select Gender
</option>

<option value="female">
Female
</option>

<option value="male">
Male
</option>

</select>

</label>


<label class="field">

Account Type

<select id="signupRole">

<option value="freelancer">
Freelancer
</option>

<option value="client">
Client
</option>

</select>

</label>


<button
    class="primary login-action"
    id="signupBtn"
>

Create Account

</button>


<button
    class="secondary login-action"
    id="showLogin"
>

Back to Login

</button>

</div>


<div
    id="authMessage"
    class="success auth-message"
></div>


</div>

</main>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    updateDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyAOCEJrsfxYnY_d6966vNyzdh61mo245sE",

    authDomain:
        "elite-freelance-hub.firebaseapp.com",

    projectId:
        "elite-freelance-hub",

    storageBucket:
        "elite-freelance-hub.firebasestorage.app",

    messagingSenderId:
        "777611553956",

    appId:
        "1:777611553956:web:730b7df36570ff803a8a31"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


const $ =
    id =>
        document.getElementById(id);


const message =
    text =>
        $("authMessage").textContent = text;


$("showSignup").onclick = () => {

    $("loginBox").style.display =
        "none";

    $("signupBox").style.display =
        "block";

    $("authTitle").textContent =
        "Create Account";

    message("");

};


$("showLogin").onclick = () => {

    $("signupBox").style.display =
        "none";

    $("loginBox").style.display =
        "block";

    $("authTitle").textContent =
        "Welcome Back";

    message("");

};


$("signupBtn").onclick =
async () => {

    try {

        const name =
            $("signupName").value.trim();

        const email =
            $("signupEmail").value.trim();

        const password =
            $("signupPassword").value;

        const gender =
            $("signupGender").value;

        const role =
            $("signupRole").value;


        if (!name || !email || !gender || !role) {

            message(
                "Please fill all fields."
            );

            return;

        }


        if (password.length < 6) {

            message(
                "Password must be at least 6 characters."
            );

            return;

        }


        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await updateProfile(
            credential.user,
            {
                displayName:name
            }
        );


        await setDoc(
            doc(
                db,
                "users",
                credential.user.uid
            ),
            {

                name:name,

                email:email,

                role:role,

                gender:gender,

                skills:"",

                createdAt:
                    serverTimestamp(),

                lastLoginAt:
                    serverTimestamp()

            }
        );


        location.href =
            role === "client"
                ? "client-dashboard.html"
                : "index.html";


    } catch (error) {

        console.error(error);

        message(
            error?.message ||
            "Account could not be created."
        );

    }

};


$("loginBtn").onclick =
async () => {

    try {

        const email =
            $("loginEmail").value.trim();

        const password =
            $("loginPassword").value;


        if (!email || !password) {

            message(
                "Enter your email and password."
            );

            return;

        }


        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        const userRef =
            doc(
                db,
                "users",
                user.uid
            );


        const snap =
            await getDoc(userRef);


        let data =
            snap.exists()
                ? snap.data()
                : {};


        if (!snap.exists()) {

            await setDoc(
                userRef,
                {

                    name:
                        user.displayName ||
                        email.split("@")[0],

                    email:email,

                    role:"freelancer",

                    gender:"",

                    skills:"",

                    createdAt:
                        serverTimestamp(),

                    lastLoginAt:
                        serverTimestamp()

                }
            );

            data = {
                role:"freelancer"
            };

        } else {

            await updateDoc(
                userRef,
                {
                    lastLoginAt:
                        serverTimestamp()
                }
            );

        }


        const role =
            data.role === "client"
                ? "client"
                : "freelancer";


        location.href =
            role === "client"
                ? "client-dashboard.html"
                : "index.html";


    } catch (error) {

        console.error(error);

        message(
            error?.message ||
            "Login failed."
        );

    }

};

</script>

</body>
</html>
