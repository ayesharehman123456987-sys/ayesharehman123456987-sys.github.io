<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELITE FREELANCE HUB — Login</title><link rel="icon" href="profile.png"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,rgba(125,70,255,.18),transparent 35%),#060a14;color:#fff;font:14px Inter,Arial,sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(470px,100%);background:linear-gradient(145deg,#0d1424,#0a101d);border:1px solid #26324b;border-radius:18px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.4)}.brand{display:flex;gap:10px;align-items:center;justify-content:center}.brand span{font-size:28px;color:#a96bff}.brand b{display:block;font-size:20px}.brand small{color:#8993aa;font-size:10px;letter-spacing:1px}h1{text-align:center;font-size:26px;margin:22px 0 6px}.sub{text-align:center;color:#8993aa;margin-bottom:24px}label{display:block;margin:14px 0 7px;color:#b9c3d5;font-weight:700;font-size:12px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2a354d;background:#080e1b;color:#fff;outline:0}button{width:100%;padding:12px;border-radius:10px;border:0;background:linear-gradient(135deg,#8b51ff,#7133e7);color:#fff;font-weight:800;margin-top:18px;cursor:pointer}.switch{text-align:center;color:#8893a8;margin-top:18px}.switch button{display:inline;width:auto;padding:0;margin:0;background:none;color:#b67cff}#message{min-height:24px;text-align:center;margin-top:12px;color:#7ee3a5;font-size:12px}</style></head><body><div class="box"><div class="brand"><span>✦</span><div><b>ELITE</b><small>FREELANCE HUB</small></div></div><h1 id="heading">Welcome Back</h1><p class="sub">Real freelance marketplace</p><div id="loginForm"><label>Email</label><input id="loginEmail" type="email" placeholder="you@example.com"><label>Password</label><input id="loginPassword" type="password"><button id="loginBtn">Login</button><div class="switch">Don't have an account? <button id="showSignup">Create Account</button></div></div><div id="signupForm" style="display:none"><label>Your Name</label><input id="signupName"><label>Email</label><input id="signupEmail" type="email"><label>Password</label><input id="signupPassword" type="password"><label>Account Type</label><select id="signupRole"><option value="freelancer">Freelancer</option><option value="client">Client</option></select><button id="signupBtn">Create Account</button><div class="switch">Already have an account? <button id="showLogin">Login</button></div></div><div id="message"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={
  apiKey:"AIzaSyAOCEJrsfxYnY_d6966vNyzdh61mo245sE",
  authDomain:"elite-freelance-hub.firebaseapp.com",
  projectId:"elite-freelance-hub",
  storageBucket:"elite-freelance-hub.firebasestorage.app",
  messagingSenderId:"777611553956",
  appId:"1:777611553956:web:730b7df36570ff803a8a31"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),msg=t=>$("message").textContent=t;
$("showSignup").onclick=()=>{$("loginForm").style.display="none";$("signupForm").style.display="block";$("heading").textContent="Create Account";msg("")};$("showLogin").onclick=()=>{$("signupForm").style.display="none";$("loginForm").style.display="block";$("heading").textContent="Welcome Back";msg("")};
$("signupBtn").onclick=async()=>{const name=$("signupName").value.trim(),email=$("signupEmail").value.trim(),password=$("signupPassword").value,role=$("signupRole").value;if(!name||!email||password.length<6)return msg("Fill all fields. Password must be at least 6 characters.");try{const c=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,"users",c.user.uid),{name,email,role,skills:""});location.href=role==="client"?"client-dashboard.html":"index.html"}catch(e){msg(e.message)}};
$("loginBtn").onclick=async()=>{const email=$("loginEmail").value.trim(),password=$("loginPassword").value;if(!email||!password)return msg("Enter email and password.");try{const c=await signInWithEmailAndPassword(auth,email,password),s=await getDoc(doc(db,"users",c.user.uid));if(!s.exists())return msg("Account profile not found.");location.href=s.data().role==="client"?"client-dashboard.html":"index.html"}catch(e){msg(e.message)}};
</script></body></html>
