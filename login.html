<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELITE FREELANCE HUB — Login</title><link rel="icon" href="profile.png"><link rel="stylesheet" href="style.css"></head><body><main class="main" style="margin:0;max-width:560px;margin-inline:auto;min-height:100vh;display:grid;place-items:center"><div class="form-box" style="width:100%;padding:26px"><div class="brand" style="justify-content:center;border-bottom:0"><span class="mark">✦</span><div><strong>ELITE</strong><small>FREELANCE HUB</small></div></div><div class="page-head" style="text-align:center"><label>REAL MARKETPLACE</label><h2 id="authTitle">Welcome Back</h2><p>Sign in to your real account.</p></div><div id="loginBox"><label class="field">Email<input id="loginEmail" type="email"></label><label class="field">Password<input id="loginPassword" type="password"></label><button class="primary" id="loginBtn" style="margin-top:15px;width:100%">Login</button><button class="secondary" id="showSignup" style="margin-top:10px;width:100%">Create Account</button></div><div id="signupBox" style="display:none"><label class="field">Name<input id="signupName"></label><label class="field">Email<input id="signupEmail" type="email"></label><label class="field">Password<input id="signupPassword" type="password"></label><label class="field">Account Type<select id="signupRole"><option value="freelancer">Freelancer</option><option value="client">Client</option></select></label><button class="primary" id="signupBtn" style="margin-top:15px;width:100%">Create Account</button><button class="secondary" id="showLogin" style="margin-top:10px;width:100%">Back to Login</button></div><div id="authMessage" class="success" style="margin-top:12px;text-align:center"></div></div></main><script type="module">import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";import {getFirestore,doc,setDoc,getDoc} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";const firebaseConfig = {
  apiKey: "AIzaSyAOCEJrsfxYnY_d6966vNyzdh61mo245sE",
  authDomain: "elite-freelance-hub.firebaseapp.com",
  projectId: "elite-freelance-hub",
  storageBucket: "elite-freelance-hub.firebasestorage.app",
  messagingSenderId: "777611553956",
  appId: "1:777611553956:web:730b7df36570ff803a8a31"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id),m=t=>$("authMessage").textContent=t;$("showSignup").onclick=()=>{$("loginBox").style.display="none";$("signupBox").style.display="block";$("authTitle").textContent="Create Account";m("")};$("showLogin").onclick=()=>{$("signupBox").style.display="none";$("loginBox").style.display="block";$("authTitle").textContent="Welcome Back";m("")};$("signupBtn").onclick=async()=>{try{const n=$("signupName").value.trim(),e=$("signupEmail").value.trim(),p=$("signupPassword").value,r=$("signupRole").value;if(!n||!e||p.length<6)return m("Fill all fields. Password must be at least 6 characters.");const c=await createUserWithEmailAndPassword(auth,e,p);await setDoc(doc(db,"users",c.user.uid),{name:n,email:e,role:r,skills:""});location.href=r==="client"?"client-dashboard.html":"index.html"}catch(e){m(e.message)}};$("loginBtn").onclick=async()=>{try{const c=await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value),s=await getDoc(doc(db,"users",c.user.uid));location.href=s.exists()&&s.data().role==="client"?"client-dashboard.html":"index.html"}catch(e){m(e.message)}};</script></body></html>
