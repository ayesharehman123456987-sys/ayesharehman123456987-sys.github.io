<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>
Login / Sign Up — ELITE FREELANCE HUB
</title>

<link
  rel="icon"
  href="profile.png">

<link
  rel="stylesheet"
  href="style.css">

</head>


<body class="auth-page">

<main class="auth-main">

<section class="auth-card">

<div class="auth-brand">

<img
  src="profile.png"
  class="auth-logo"
  alt="ELITE FREELANCE HUB">

<div>

<strong>
ELITE FREELANCE HUB
</strong>

<small>
CONNECT • COLLABORATE • SUCCEED
</small>

</div>

</div>


<div class="auth-tabs">

<button
  id="loginTab"
  class="active"
  type="button">
Login
</button>

<button
  id="signupTab"
  type="button">
Create Account
</button>

</div>


<form id="loginForm">

<div class="auth-head">

<h2>
Welcome Back! 👋
</h2>

<p>
Login to your account.
</p>

</div>


<label class="field">

Email

<input
  id="loginEmail"
  type="email"
  required
  autocomplete="email"
  placeholder="you@example.com">

</label>


<label class="field">

Password

<input
  id="loginPassword"
  type="password"
  required
  autocomplete="current-password"
  placeholder="Your password">

</label>


<div class="auth-options">

<label>

<input
  id="rememberMe"
  type="checkbox">

Remember me

</label>


<button
  id="forgotBtn"
  class="link"
  type="button">

Forgot Password?

</button>

</div>


<button
  class="primary auth-button"
  type="submit">
Login
</button>


<div
  id="loginMsg"
  class="auth-message">
</div>

</form>


<form
  id="signupForm"
  class="hidden">

<div class="auth-head">

<h2>
Create Your Account 🚀
</h2>

<p>
Join ELITE FREELANCE HUB.
</p>

</div>


<label class="field">

Display Name

<input
  id="signupName"
  required
  maxlength="80"
  autocomplete="name"
  placeholder="Your name">

</label>


<label class="field">

Email

<input
  id="signupEmail"
  type="email"
  required
  autocomplete="email"
  placeholder="you@example.com">

</label>


<label class="field">

Password

<input
  id="signupPassword"
  type="password"
  minlength="6"
  required
  autocomplete="new-password"
  placeholder="Minimum 6 characters">

</label>


<label class="field">

Account Type

<select id="signupRole">

<option value="freelancer">
Freelancer
</option>

<option value="client">
Client
</option>

</select>

</label>


<button
  class="primary auth-button"
  type="submit">
Create Account
</button>


<div
  id="signupMsg"
  class="auth-message">
</div>

</form>


<div class="auth-note">

👑
<b>Owner:</b>
Ayesha Rehman — Owner + Freelancer access only.

<br>

All other accounts are either Freelancer or Client.

</div>

</section>

</main>


<div
  id="firebaseError"
  class="firebase-error">
</div>


<script
  type="module"
  src="script.js">
</script>

</body>
</html>
