<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>
Post a Project — ELITE FREELANCE HUB
</title>

<link
rel="icon"
href="profile.png"
>

<link
rel="stylesheet"
href="style.css"
>

</head>


<body
class="client"
data-role="client"
>


<div class="app-shell">


<aside class="sidebar">


<button
class="brand"
id="brandHome"
type="button"
>

<img
src="profile.png"
alt="ELITE logo"
>

<span>
<b>ELITE</b>
<small>FREELANCE HUB</small>
</span>

</button>


<div class="profile-mini">

<img
id="sideAvatar"
src="profile.png"
class="avatar-img"
alt="Profile"
>

<div>

<strong id="sideName">
Loading...
</strong>

<span id="sideRole">
Professional Client
</span>

</div>

</div>


<nav
id="navArea"
class="sidebar-nav"
></nav>


<div class="sidebar-footer">

<button
class="side-action"
id="switchMode"
type="button"
>
⇄ Switch Mode
</button>

<button
class="side-action"
id="helpBtn"
type="button"
>
♧ Help & Support
</button>

<button
class="side-action danger"
id="logoutBtn"
type="button"
>
↪ Logout
</button>

</div>

</aside>


<main class="main-content">


<header class="topbar">

<div>

<span class="eyebrow">
CREATE PROJECT
</span>

<h1 id="pageTitle">
Post a Project
</h1>

</div>


<div class="top-actions">

<button
class="icon-btn"
id="themeToggle"
type="button"
>
◐
</button>

<button
class="top-user"
id="topProfileBtn"
type="button"
>

<img
id="topAvatar"
src="profile.png"
class="avatar-img"
alt="Profile"
>

<span id="topName">
Member
</span>

</button>


<button
class="outline-danger"
id="topLogout"
type="button"
>
↪ Logout
</button>

</div>

</header>


<section
class="page active"
id="postPage"
>

<div class="page-heading">

<span>
PROJECT
</span>

<h2>
Post a Project
</h2>

<p>
Tell freelancers what you need.
</p>

</div>


<div class="form-panel">


<form id="postForm">


<div class="form-grid">


<label>

Project Title

<input
id="postTitle"
required
>

</label>


<label>

Category

<select
id="postCategory"
required
>

<option value="">
Select
</option>

<option>
Web Development
</option>

<option>
Graphic Design
</option>

<option>
Data Entry
</option>

<option>
Content Writing
</option>

<option>
Digital Marketing
</option>

<option>
Video Editing
</option>

</select>

</label>


<label class="full">

Project Description

<textarea
id="postDescription"
required
></textarea>

</label>


<label>

Budget (USD)

<input
id="postBudget"
type="number"
min="1"
required
>

</label>


<label>

Deadline

<input
id="postDeadline"
type="date"
required
>

</label>


</div>


<div class="form-actions">

<button
class="primary"
id="postBtn"
type="submit"
>
🚀 Publish Project
</button>

<span
id="postMessage"
class="form-message"
></span>

</div>


</form>

</div>

</section>


<div
id="firebaseError"
class="firebase-error"
></div>


</main>

</div>


<script
type="module"
src="script.js"
></script>

</body>
</html>
